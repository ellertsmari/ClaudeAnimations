<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>From one island to another</title>
    <style>
      @font-face { font-family: Fredoka; src: url("assets/fonts/fredoka-600.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: Fredoka; src: url("assets/fonts/fredoka-700.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1b1712; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1b1712; }
      /* the whole film is one WebGL canvas, redrawn by the clay engine from the seek time */
      #clay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #cap { position: absolute; left: 0; right: 0; bottom: 58px; display: flex; justify-content: center; padding: 0 160px; pointer-events: none; }
      #cap span { display: inline-block; max-width: 1500px; text-align: center; font: 600 40px/1.32 Fredoka, sans-serif; color: #fffaf0;
        background: rgba(30, 22, 14, 0.64); padding: 6px 22px 8px; border-radius: 12px; }
      #cap span:empty { display: none; }
      #font-warm { position: absolute; left: -9999px; font: 600 40px Fredoka; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-iv9a" id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-fps="24" data-duration="96.8">
      <canvas data-hf-id="hf-q8jw" id="clay" width="1920" height="1080" data-layout-allow-overflow="true"></canvas>
      <div data-hf-id="hf-dg3w" id="cap" data-layout-allow-overflow="true"><span data-hf-id="hf-c3kb" id="capText"></span></div>
      <span data-hf-id="hf-knnz" id="font-warm" data-layout-allow-overflow="true">Tækniskólinn Vefskólinn El Rincón ¡Gracias!</span>
      <audio data-hf-id="hf-7uah" id="soundtrack" src="assets/audio/mix.mp3" data-start="0" data-duration="96.8" data-track-index="1" data-volume="1"></audio>
    </div>

    <script src="storyboard/vendor/gsap.min.js"></script>
    <script src="assets/timeline.js"></script>
    <script type="module">
      // Every frame is drawn from its time alone (seek-safe): the shot for t, posed at t
      // stepped to 12 poses/s, light flicker and clay boil seeded by the pose number.
      import { makeRenderer, setPose, flicker } from "./storyboard/clay.js";
      import { createDirector, captions } from "./storyboard/scenes.js";
      import { loadFonts } from "./storyboard/props.js";

      const tl = window.TIMELINE;
      const canvas = document.getElementById("clay");
      const capText = document.getElementById("capText");
      let director, caps;

      function drawAt(t) {
        if (!director) return;
        const s = setPose(t);
        flicker(director.renderer, s);
        director.render(t);
        const c = caps.find((c) => t >= c.start && t < c.end);
        const txt = c ? c.text : "";
        if (capText.textContent !== txt) capText.textContent = txt;
      }

      async function build() {
        await loadFonts("");
        await document.fonts.load('600 40px Fredoka');
        const renderer = makeRenderer(canvas, 1920, 1080);
        director = createDirector(renderer, tl);
        director.renderer = renderer;
        caps = captions(tl);
        // build every set up front so seeking never waits on sculpting
        for (const shot of director.shots) director.prepare(shot);
        // one linear proxy tween on the paused root timeline; every seek redraws from its time
        const LENGTH = 96.8;
        const root = gsap.timeline({ paused: true });
        const proxy = { t: 0 };
        root.to(proxy, { t: LENGTH, duration: LENGTH, ease: "none", onUpdate: () => drawAt(proxy.t) }, 0);
        drawAt(0);
        window.__timelines["main"] = root;
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["clay-film"] = build();
    </script>
  </body>
</html>

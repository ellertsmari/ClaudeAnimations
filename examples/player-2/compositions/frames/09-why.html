    (function () {
      var DUR = 8.693;

      // ---- helpers -------------------------------------------------------
      // split an element's text into per-character spans, each carrying its own caret
      function split(el) {
        var chars = [];
        var nodes = Array.prototype.slice.call(el.childNodes);
        nodes.forEach(function (n) {
          if (n.nodeType !== 3) return;
          var frag = document.createDocumentFragment();
          Array.from(n.textContent).forEach(function (c) {
            var s = document.createElement("span");
            s.className = "w09-ch";
            s.textContent = c;
            var k = document.createElement("span");
            k.className = "w09-caret";
            s.appendChild(k);
            frag.appendChild(s);
            chars.push(s);
          });
          el.replaceChild(frag, n);
        });
        return chars;
      }
      // typewriter: char i snaps visible at t0 + i*step; caret rides the newest char,
      // blinks ~2Hz on the last one, then switches off at caretOff
      function type(el, t0, step, caretOff) {
        var chars = split(el);
        chars.forEach(function (c, i) {
          var t = t0 + i * step;
          var caret = c.querySelector(".w09-caret");
          tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, t);
          tl.fromTo(caret, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, t);
          if (i < chars.length - 1) {
            tl.set(caret, { opacity: 0 }, t + step);
          } else {
            var b = t + 0.25, on = false;
            while (b < caretOff) { tl.set(caret, { opacity: on ? 1 : 0 }, b); on = !on; b += 0.25; }
            tl.set(caret, { opacity: 0 }, caretOff);
          }
        });
        return t0 + (chars.length - 1) * step;
      }
      // stepped draw of a mask path (svg-path-draw, stepped ease)
      function draw(id, fallbackLen, t0, dur, steps) {
        var p = $(id);
        var len = (p.getTotalLength && p.getTotalLength()) || fallbackLen;
        len = len * 1.02;
        tl.fromTo(p,
          { strokeDasharray: len + " " + len, strokeDashoffset: len },
          { strokeDashoffset: 0, duration: dur, ease: "steps(" + steps + ")" }, t0);
      }
      // pixel panel opening on hard steps
      function openPanel(el, t0) {
        tl.fromTo(el, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.18, ease: "steps(3)" }, t0);
      }
      // ring lights with an arcade flicker: on (cue) · off · on
      function light(ring, t0) {
        tl.fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, t0);
        tl.set(ring, { opacity: 0 }, t0 + 0.07);
        tl.set(ring, { opacity: 1 }, t0 + 0.14);
      }
      function stepIn(el, t0, toOpacity) {
        tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: toOpacity || 1, y: 0, duration: 0.16, ease: "steps(2)" }, t0);
      }

      // ---- furniture: 2UP "PRESS START" blinks ~2Hz across the frame (finite) ----
      (function () {
        var t = 0.25, on = false;
        while (t < DUR) { tl.set($("press"), { opacity: on ? 1 : 0 }, t); on = !on; t += 0.25; }

      // ---- Scene 1 (0.00–2.47): players · header types on "starfendarannsókn" · footer ----
      tl.fromTo($("p1"), { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.18, ease: "steps(3)" }, 0.2);
      tl.fromTo($("p2"), { opacity: 0, y: -18 }, { opacity: 0.6, y: 0, duration: 0.18, ease: "steps(3)" }, 0.32);
      // 2-frame idle bob, phase-opposed (P1 up while the ghost is down)
      (function () {
        var t = 1.0, up = true;
        while (t < DUR) {
          tl.set($("p1"), { y: up ? -6 : 0 }, t);
          tl.set($("p2"), { y: up ? 0 : -6 }, t);
          up = !up; t += 0.5;
        }
      })();

      type($("head"), 0.76, 0.04, 2.4);          // blip@0.76
      stepIn($("foot"), 1.6);

      // ---- Scene 2 (2.47–5.30): path draws from the players and forks; route A lights ----
      draw("d1", 27.5, 2.50, 0.70, 11);         // draw@2.50  — trunk + upper branch
      draw("d2", 19.4, 2.70, 0.50, 8);          // lower branch leaves the fork as the trunk reaches it
      openPanel($("cardA"), 3.12);              // empty slots open as the branches land on them
      openPanel($("cardB"), 3.12);

      light($("ringA"), 3.78);                  // blip@3.78  on "kennari"
      tl.fromTo($("lblA"), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 3.78);
      type($("textA"), 3.88, 0.035, 5.3);

      light($("ringB"), 5.68);                  // blip@5.68
      tl.fromTo($("lblB"), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 5.68);
      type($("textB"), 5.78, 0.03, 6.95);

      // ---- Scene 4 (7.00–8.69): both routes extend right and meet; star pops; hold ----
      draw("d3", 16.5, 6.95, 0.33, 6);
      draw("d4", 12.4, 7.03, 0.25, 5);
      // 2-step pop landing exactly on star@7.28

      tl.set($("star"), { scale: 1 }, 7.44);

      // held read: one-pixel stepped jitter on the focal star only

      tl.set($("star"), { y: 0 }, 8.5);

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "04-player-two-wanted";
      var DUR = 6.817;
      var $ = function (n) { return document.getElementById(ID + "-" + n); };

      // --- build the typed line: one span per character, caret moves through them ---
      var wanted = $("wanted");
      var SEGS = [{ t: "ÓSKAST:", pink: true }, { t: " kennari með hugmynd", pink: false }];
      var chars = [];
      SEGS.forEach(function (s) {
        Array.from(s.t).forEach(function (c) {
          var sp = document.createElement("span");
          sp.className = ID + "-ch";
          if (s.pink) sp.setAttribute("data-pink", "");
          sp.textContent = c;
          wanted.appendChild(sp);
          chars.push(sp);
        });
      });
      var caret = document.createElement("span");
      caret.id = ID + "-caret";
      wanted.insertBefore(caret, wanted.firstChild);

      var TYPE_START = 2.3, TYPE_END = 4.4;
      var N = chars.length;

      var tl = gsap.timeline({ paused: true });

      // master driver: typing + caret, computed purely from time (seek-safe)
      var drv = { t: 0 };
      var lastN = -1;
      tl.to(drv, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: function () {
          var t = drv.t;
          var n = t < TYPE_START ? 0 : Math.min(N, Math.floor((t - TYPE_START) / (TYPE_END - TYPE_START) * N) + 1);
          if (t >= TYPE_END) n = N;
          if (n !== lastN) {
            for (var i = 0; i < N; i++) chars[i].style.visibility = i < n ? "visible" : "hidden";
            if (n === 0) wanted.insertBefore(caret, chars[0]);
            else chars[n - 1].after(caret);
            lastN = n;
          }
          var on;
          if (t < TYPE_START) on = false;
          else if (t < TYPE_END) on = true;
          else on = Math.floor((t - TYPE_END) / 0.25) % 2 === 1;
          caret.style.opacity = on ? "1" : "0";
        }
      }, 0);

      // stepped blink helper: toggles opacity on a fixed cadence, finite
      function blink(el, from, to, half, onVal, offVal, endOn) {
        var state = true, k = 0;
        for (var t = from + half; t < to - 0.001; t += half) {
          state = !state; k++;
          tl.set(el, { opacity: state ? onVal : offVal }, t);
        }
        tl.set(el, { opacity: endOn ? onVal : offVal }, to);
      }

      // Scene 1 (0–1.16): P1 present; stepped 2-frame idle bob (6px = one game pixel)
      [["smari", 0], ["jakub", 0.25]].forEach(function (p) {
        var el = $(p[0]);
        tl.set(el, { y: 0 }, 0);
        var up = false;
        for (var t = 0.5 + p[1]; t < DUR; t += 0.5) {
          up = !up;
          tl.set(el, { y: up ? -6 : 0 }, t);
        }
      });

      // HUD 2UP PRESS START sits dim until "tvö"
      tl.fromTo($("press"), { opacity: 0.4 }, { opacity: 0.4, duration: 0.01 }, 0);

      // Scene 2 (1.16): pink dashed slot flickers on in 3 steps  [sfx blip-lo@1.16]
      tl.fromTo($("slot"), { opacity: 0 }, { opacity: 1, duration: 0.27, ease: "steps(3)" }, 1.16);

      // 1.85 "tvö": PLAYER 2 blinks on; HUD PRESS START brightens and blinks  [sfx blink@1.85]
      var p2t = $("p2title");
      tl.fromTo(p2t, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "steps(1)" }, 1.85);
      tl.set(p2t, { opacity: 0 }, 2.0);
      tl.set(p2t, { opacity: 1 }, 2.12);
      tl.set($("press"), { opacity: 1 }, 1.85);
      blink($("press"), 1.85, DUR - 0.05, 0.25, 1, 0.15, true);

      // Scene 3 (2.27 "kennara"): ghost steps in, "?" pops above its head  [sfx type-blips@2.27]
      tl.fromTo($("ghost"), { opacity: 0, y: 36 }, { opacity: 0.45, y: 0, duration: 0.24, ease: "steps(3)" }, 2.27);
      var q = $("q");
      tl.fromTo(q, { opacity: 0, scale: 0.4, transformOrigin: "50% 80%" },
        { opacity: 1, scale: 1, duration: 0.12, ease: "steps(2)" }, 2.45);
      blink(q, 3.0, 5.27, 0.25, 1, 0, true);
      // (typing 2.3 -> 4.4 driven by the master driver above)

      // Scene 4 (5.27 "gervigreindinni"): chip drops from HUD, 2-step bounce  [sfx powerup@5.35 = landing]
      var chip = $("chip");
      tl.fromTo(chip, { opacity: 0, y: -284 }, { opacity: 1, y: -284, duration: 0.01 }, 0);
      tl.set(chip, { opacity: 1 }, 5.27);
      tl.to(chip, { y: 0, duration: 0.08, ease: "steps(2)" }, 5.27);
      tl.set(chip, { opacity: 1 }, 5.35);
      tl.to(chip, { y: -30, duration: 0.07, ease: "steps(2)" }, 5.35);
      tl.to(chip, { y: 0, duration: 0.07, ease: "steps(2)" }, 5.42);
      tl.to(chip, { y: -12, duration: 0.05, ease: "steps(1)" }, 5.49);
      tl.to(chip, { y: 0, duration: 0.05, ease: "steps(1)" }, 5.54);

      // 5.6: GERVIGREIND label appears, then held read to the end
      tl.fromTo($("chiplbl"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "steps(2)" }, 5.6);

      // pin the timeline length to the frame duration
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>

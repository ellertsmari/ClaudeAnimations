    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "06-level-two";
        var root = document.querySelector('[data-composition-id="' + ID + '"]') || document;
        function el(n) { return root.querySelector('[id="' + ID + '-' + n + '"]'); }

        var INK = "#F4F1FF", COIN = "#FFE14D", XP = "#7CFF6B", SHADOW = "#0A0818";
        var SH_BASE = "0 0 0 6px #F4F1FF, 11.52px 11.52px 0 6px #0A0818";
        var SH_NOW = "0 0 0 6px #F4F1FF, 0 0 0 18px rgba(255,225,77,.35), 11.52px 11.52px 0 6px #0A0818";

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.00-1.33): banner LEVEL 2 snaps in on the jingle (0.10) ----
        var lvl = el("lvl");
        tl.fromTo(lvl, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, ease: "steps(1)" }, 0);
        tl.fromTo(lvl, { x: -48 }, { x: 0, duration: 0.10, ease: "steps(2)" }, 0);

        // node 1: coin -> green with check, 2 hard steps landing 0.30
        var n1 = el("n1");
        tl.set(n1, { backgroundColor: INK, boxShadow: SH_BASE }, 0.22);
        tl.set(n1, { backgroundColor: XP }, 0.30);
        tl.set(el("n1d"), { display: "none" }, 0.30);
        tl.set(el("n1c"), { display: "block" }, 0.30);

        // node 2: inactive -> coin (current level), 2 hard steps
        var n2 = el("n2");
        tl.set(n2, { backgroundColor: INK, color: SHADOW }, 0.46);
        tl.set(n2, { backgroundColor: COIN, boxShadow: SH_NOW }, 0.54);

        // "Saman" types per character behind a yellow caret from 1.33
        var caret = el("caret");
        tl.fromTo(caret, { display: "none" }, { display: "inline-block", duration: 0.001, ease: "none" }, 1.27);
        for (var i = 0; i < 5; i++) {
          tl.fromTo(el("c" + i), { display: "none" }, { display: "inline", duration: 0.001, ease: "none" }, 1.33 + i * 0.07);
        }
        // finite 2Hz-ish caret blink, then it leaves the line
        tl.set(caret, { opacity: 0 }, 1.90);
        tl.set(caret, { opacity: 1 }, 2.15);
        tl.set(caret, { display: "none" }, 2.40);

        // HUD: PRESS START blinks ~2Hz across the whole shot (finite)
        var press = el("press");
        for (var k = 1; k <= 26; k++) tl.set(press, { opacity: k % 2 ? 0 : 1 }, k * 0.25);

        // ---- Scene 2 (1.33-4.30): empty window opens, P1 builders drop in on "Við" ----
        var win = el("win");
        tl.fromTo(win, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.08, ease: "steps(1)" }, 1.50);
        tl.fromTo(win, { scaleY: 0 }, { scaleY: 1, duration: 0.24, ease: "steps(3)" }, 1.50);

        var p1a = el("p1a"), p1b = el("p1b");
        [[p1a, 2.50], [p1b, 2.56]].forEach(function (p) {
          tl.fromTo(p[0], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, ease: "steps(1)" }, p[1]);
          tl.fromTo(p[0], { y: -48 }, { y: 0, duration: 0.16, ease: "steps(3)" }, p[1]);
        });

        // bricks: three hard-stepped drops landing 2.88 / 3.25 / 3.60 (bottom row first)
        var drops = [["r1", 2.88, 144], ["r2", 3.25, 108], ["r3", 3.60, 72]];
        drops.forEach(function (d) {
          var row = el(d[0]), t = d[1];
          tl.fromTo(row, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, ease: "steps(1)" }, t - 0.15);
          tl.fromTo(row, { y: -d[2] }, { y: 0, duration: 0.15, ease: "steps(3)" }, t - 0.15);
          // impact: window jolts one game pixel, builders hop
          tl.set(win, { y: 6 }, t);
          tl.set(win, { y: 0 }, t + 0.06);
          tl.set([p1a, p1b], { y: -12 }, t);
          tl.set([p1a, p1b], { y: 0 }, t + 0.08);
        });

        // "ÚTGÁFA 1" stamps into the window header on "útgáfuna" (3.57)
        tl.fromTo(el("ver"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.08, ease: "steps(2)" }, 3.49);

        // builders' 2-frame idle bob through the rest of the shot
        for (var b = 0; b < 6; b++) {
          var bt = 3.90 + b * 0.5;
          tl.set(p1a, { y: -6 }, bt);
          tl.set(p1a, { y: 0 }, bt + 0.25);
          tl.set(p1b, { y: -6 }, bt + 0.25);
          tl.set(p1b, { y: 0 }, bt + 0.5);
        }

        // ---- Scene 3 (4.30-6.67): students run in on "nemendunum" (5.10) ----
        for (var s = 0; s < 3; s++) {
          var st = el("s" + s), t0 = 5.10 + s * 0.06;
          tl.fromTo(st, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.001, ease: "none" }, t0);
          tl.fromTo(st, { x: 720 }, { x: 0, duration: 0.48, ease: "steps(6)" }, t0);
          for (var w = 1; w <= 5; w++) tl.set(st, { y: w % 2 ? -6 : 0 }, t0 + w * 0.08);
          tl.set(st, { y: 0 }, t0 + 0.48);

          // hearts pop above each on "þínum" (5.74), 2-step pop, staggered
          var h = el("h" + s), ht = 5.74 + s * 0.10;
          tl.fromTo(h, { autoAlpha: 0, scale: 0.4, y: 12 }, { autoAlpha: 1, scale: 1.35, y: -6, duration: 0.08, ease: "steps(1)" }, ht - 0.08);
          tl.to(h, { scale: 1, y: 0, duration: 0.08, ease: "steps(1)" }, ht);
          // the student hops as their heart pops
          tl.set(st, { y: -12 }, ht);
          tl.set(st, { y: 0 }, ht + 0.08);
        }

        // label under the students stamps in as they line up
        tl.fromTo(el("stl"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.08, ease: "steps(2)" }, 5.58);

        // XP bar steps from 4 to 8 cells starting on the xp cue (6.10)
        for (var x = 0; x < 4; x++) tl.set(el("x" + (4 + x)), { backgroundColor: XP }, 6.10 + x * 0.06);

        // hold to the end of the frame
        tl.set({}, {}, 6.668);

        window.__timelines[ID] = tl;
      })();
    </script>

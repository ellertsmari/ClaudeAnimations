    <!-- Player 1 sprites: Smári, Jakub -->

  <script>
    (function () {
      var $ = function (n) { return document.getElementById("02-quest-select-" + n); };
      var COIN = "#FFE14D", DIM = "#A9A3D9";
      var tl = gsap.timeline({ paused: true });

      // split text nodes into per-character spans (typewriter), preserving nested color spans
      function splitChars(el) {
        var out = [];
        (function walk(node) {
          Array.prototype.slice.call(node.childNodes).forEach(function (n) {
            if (n.nodeType === 3) {
              var frag = document.createDocumentFragment();
              Array.from(n.textContent).forEach(function (ch) {
                var s = document.createElement("span");
                s.textContent = ch;
                frag.appendChild(s);
                out.push(s);
              });
              n.parentNode.replaceChild(frag, n);
            } else if (n.nodeType === 1) {
              walk(n);
            }
          });
        })(el);
        return out;
      }
      function typeIn(chars, t0, dt) {
        chars.forEach(function (c, i) { tl.set(c, { opacity: 1 }, t0 + i * dt); });
      }

      var head = splitChars($("head"));
      var items = [$("i1"), $("i2"), $("i3"), $("i4")];
      var itemChars = items.map(splitChars);
      var cursor = $("cursor"), panel = $("panel"), box = $("box"), stamp = $("stamp");
      var smari = $("smari"), jakub = $("jakub"), qqq = $("qqq"), press = $("press");
      var STEP = 107.52; // one menu row (5.6cqw)

      // ---- initial states (t = 0) ----
      tl.set(panel, { opacity: 0, scaleY: 0.08, transformOrigin: "50% 0%" }, 0);
      tl.set(head, { opacity: 0 }, 0);
      itemChars.forEach(function (cs) { tl.set(cs, { opacity: 0 }, 0); });
      tl.set(cursor, { opacity: 0, x: 0, y: 0 }, 0);
      tl.set(box, { opacity: 0 }, 0);
      tl.set(stamp, { opacity: 0, scale: 1.4, rotation: -4, transformOrigin: "50% 50%" }, 0);
      tl.set([smari, jakub], { opacity: 0, y: 0 }, 0);

      // ---- Scene 1 (0.00–0.38): panel opens on 4 hard steps (menu-open@0.05), header types ----
      tl.set(panel, { opacity: 1 }, 0.05);
      tl.fromTo(panel, { scaleY: 0.08 }, { scaleY: 1, duration: 0.24, ease: "steps(4)", immediateRender: false }, 0.05);
      typeIn(head, 0.14, 0.016);

      // cursor hop: instant first step on the cue, lands 0.05s later, 1-game-pixel kick right
      function hop(t, fromRow, toRow) {
        tl.set(cursor, { y: (fromRow + (toRow - fromRow) * 0.5) * STEP, x: 6 }, t);
        tl.set(cursor, { y: toRow * STEP }, t + 0.05);
        tl.set(cursor, { x: 0 }, t + 0.1);
      }

      // ---- Scene 2 (0.38): quest 1 + cursor arrives (blip@0.38) ----
      tl.set(items[0], { color: COIN }, 0.38);
      typeIn(itemChars[0], 0.38, 0.016);
      tl.set(cursor, { opacity: 1, y: 0, x: -12 }, 0.38);
      tl.set(cursor, { x: -6 }, 0.43);
      tl.set(cursor, { x: 0 }, 0.48);

      // ---- Scene 3 (2.54): quest 2, cursor hops, quest 1 dims (blip@2.54) ----
      tl.set(items[0], { color: DIM }, 2.54);
      tl.set(items[1], { color: COIN }, 2.54);
      typeIn(itemChars[1], 2.54, 0.016);
      hop(2.54, 0, 1);

      // ---- Scene 4 (4.93): quest 3 (blip@4.93) ----
      tl.set(items[1], { color: DIM }, 4.93);
      tl.set(items[2], { color: COIN }, 4.93);
      typeIn(itemChars[2], 4.93, 0.016);
      hop(4.93, 1, 2);

      // ---- Scene 5 (6.60): "??? — þín hugmynd" + yellow outline, cursor hops (blip-hi@6.60) ----
      tl.set(items[2], { color: DIM }, 6.60);
      typeIn(itemChars[3], 6.60, 0.016);
      hop(6.60, 2, 3);
      tl.set(box, { opacity: 1 }, 6.60);
      tl.set(box, { opacity: 0 }, 6.68);
      tl.set(box, { opacity: 1 }, 6.76);
      // ??? blinks — stepped, finite (~2 Hz), ends visible
      for (var t = 7.0, on = false; t < 9.6; t += 0.25, on = !on) {
        tl.set(qqq, { opacity: on ? 1 : 0 }, t);
      }
      tl.set(qqq, { opacity: 1 }, 9.6);

      // ---- Scene 6 (7.89): cyan stamp slams 1.4 → 1 in 2 hard steps (stamp@7.89) ----
      tl.set(stamp, { opacity: 1, scale: 1.4 }, 7.89);
      tl.set(stamp, { scale: 1.2 }, 7.95);
      tl.set(stamp, { scale: 1.0 }, 8.01);

      // P1 sprites hop up into place under it — 2-step jump (jump@8.30)
      function jump(el, t) {
        tl.set(el, { opacity: 1, y: 30 }, t);
        tl.set(el, { y: -30 }, t + 0.07);
        tl.set(el, { y: 0 }, t + 0.15);
        // 2-frame idle bob over the hold
        tl.set(el, { y: -6 }, t + 0.55);
        tl.set(el, { y: 0 }, t + 0.95);
      }
      jump(smari, 8.30);
      jump(jakub, 8.36);

      // HUD: 2UP "PRESS START" blinks across the frame (stepped, finite), ends visible
      for (var b = 0.4, vis = false; b < 9.6; b += 0.4, vis = !vis) {
        tl.set(press, { opacity: vis ? 1 : 0 }, b);
      }
      tl.set(press, { opacity: 1 }, 9.6);

      tl.set({}, {}, 9.742);
      window.__timelines = window.__timelines || {};
      window.__timelines["02-quest-select"] = tl;
    })();
  </script>

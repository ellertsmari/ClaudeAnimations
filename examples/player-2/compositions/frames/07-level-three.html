    (function () {
      var FID = "07-level-three";
      var $ = function (n) { return document.getElementById(FID + "-" + n); };
      var NIGHT3 = "#2C2560", XP = "#7CFF6B", INK = "#F4F1FF", COIN = "#FFE14D";

      // prompt characters (typed per char behind a yellow caret)
      var promptEl = $("prompt");
      var text = "Bættu við stigatöflu…";
      var chars = [];
      Array.from(text).forEach(function (ch) {
        var s = document.createElement("span");
        s.textContent = ch;
        promptEl.appendChild(s);
        chars.push(s);
      });
      var caret = document.createElement("span");
      caret.textContent = "▌";
      caret.style.color = COIN;
      promptEl.appendChild(caret);

      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.00–1.44): banner LEVEL 3, map nodes ----------
      tl.fromTo($("lvl"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.12, ease: "steps(2)" }, 0.10);
      // title words held hidden until 1.44
      ["w1", "w2", "w3"].forEach(function (w, i) {
        tl.fromTo($(w), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.08, ease: "steps(2)" }, [1.442, 1.692, 1.768][i]);
      });
      // node 3 hops on "Þriðja" and "borð"
      var n3 = $("node3");
      tl.set(n3, { y: -12 }, 0.68).set(n3, { y: 0 }, 0.80)

      // P1 2-frame idle bob before they step back
      var p1 = [$("p1a"), $("p1b")];
      [0.34, 0.68, 1.02].forEach(function (t, i) { tl.set(p1, { y: i % 2 === 0 ? -6 : 0 }, t); });
      tl.set(p1, { y: 0 }, 1.30);

      // ---------- Scene 2 (1.44–3.60): P1 step back + dim, P2 to center, joystick ----------
      tl.set(p1, { x: -172.8, opacity: 0.8, y: -12 }, 1.442)
        .set(p1, { y: 0 }, 1.50)
        .set(p1, { x: -345.6, opacity: 0.6, y: -12 }, 1.60)
        .set(p1, { y: 0 }, 1.66);

      var p2 = $("p2");
      tl.fromTo(p2, { opacity: 0, x: -115.2, y: 0 }, { opacity: 1, duration: 0.09, ease: "steps(3)" }, 1.442)
        .set(p2, { x: -57.6, y: -12 }, 1.56).set(p2, { y: 0 }, 1.62)
        .set(p2, { x: 0, y: -12 }, 1.68).set(p2, { y: 0 }, 1.74);

      var joy = $("joy");
      tl.fromTo(joy, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1.3, duration: 0.001, ease: "none" }, 1.77)
        .set(joy, { scale: 0.9 }, 1.84)
        .set(joy, { scale: 1 }, 1.91);
      // takes control: stepped tilt
      tl.set(joy, { rotation: -12 }, 2.30).set(joy, { rotation: 12 }, 2.42).set(joy, { rotation: 0 }, 2.54);
      // P2 2-frame idle bob through the shot
      for (var bt = 2.0, bi = 0; bt < 7.7; bt += 0.4, bi++) {
        tl.set(p2, { y: bi % 2 === 0 ? -6 : 0 }, bt);
      }

      // ---------- Scene 3 (3.60–4.98): bubble opens, prompt types; app window stands right ----------
      var bub = $("bubble");
      tl.fromTo(bub, { opacity: 0, scale: 0.25, transformOrigin: "714px 452px" },
        { opacity: 1, scale: 1, duration: 0.12, ease: "steps(3)" }, 3.62);
      chars.forEach(function (c, i) {
        tl.fromTo(c, { display: "none" }, { display: "inline", duration: 0.001, ease: "none" }, 3.70 + i * 0.045);
      });
      tl.set(joy, { rotation: -12 }, 3.62).set(joy, { rotation: 0 }, 3.74);

      for (var ct = 4.85, ci = 0; ct < 7.7; ct += 0.25, ci++) {
        tl.set(caret, { opacity: ci % 2 === 0 ? 0 : 1 }, ct);
      }
      tl.fromTo($("app"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.292);

      // ---------- Scene 4 (4.98–6.07): leaderboard steps in, rows fill ----------
      tl.fromTo($("board"), { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.12, ease: "steps(3)" }, 4.98);

  <script>
    (function () {
      var ID = "08-loot";
      var DUR = 8.205;
      function $(n) { return document.getElementById(ID + "-" + n); }
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var world = $("world");
      var chest = $("chestbox");
      var cardP2 = $("card-p2");
      var cardXp = $("card-xp");
      var tagP2 = $("tag-p2");
      var tagXp = $("tag-xp");
      var press = $("press");

      // ---- HUD: PRESS START blinks ~2 Hz, finite stepped sets over the whole frame

        tl.set(press, { opacity: 0 }, k * 0.5 + 0.3);
        if (k * 0.5 + 0.5 < DUR) tl.set(press, { opacity: 1 }, k * 0.5 + 0.5);

      // ---- Scene 1 (0.00–1.20): closed chest; "VERÐLAUN" types in on "Verðlaunin" (blip@0.58)
      var chars = $("title").children;
      gsap.set(chars, { opacity: 0 });
      for (var c = 0; c < chars.length; c++) {
        tl.set(chars[c], { opacity: 1 }, 0.58 + c * 0.055);
      }
      // anticipation: stepped rattle of the closed chest
      var rattle = [[0.84, 6], [0.90, -6], [0.96, 6], [1.02, -6], [1.08, 6], [1.14, 0]];
      rattle.forEach(function (r) { tl.set(chest, { x: r[1] }, r[0]); });

      // ---- Scene 2 (1.20–2.06): lid flips open in 2 steps (chest@1.20), coins burst on index arcs
      tl.set($("chest-closed-u"), { opacity: 0 }, 1.20);
      tl.set($("chest-mid-u"), { opacity: 1 }, 1.20);
      tl.set($("chest-mid-u"), { opacity: 0 }, 1.28);
      tl.set($("chest-open-u"), { opacity: 1 }, 1.28);
      tl.set(chest, { y: -12 }, 1.20);
      tl.set(chest, { y: -6 }, 1.26);
      tl.set(chest, { y: 0 }, 1.32);

      // coins launch from the chest mouth (center 960,300) and land in place
      var coins = [
        { l: 710.4, t: 230.4, s: 46.08 },
        { l: 1152, t: 211.2, s: 46.08 },
        { l: 902.4, t: 196, s: 38.4 },
        { l: 768, t: 462, s: 38.4 },
        { l: 1122, t: 456, s: 38.4 },
        { l: 858, t: 504, s: 32 },
        { l: 1014, t: 510, s: 38.4 }
      ];
      coins.forEach(function (cd, i) {
        var el = $("coin-" + i);
        var dx = (960 - cd.s / 2) - cd.l;
        var dy = (300 - cd.s / 2) - cd.t;
        var D = 0.55 + (i % 3) * 0.05;
        var t0 = 1.22 + i * 0.035;
        var apex = Math.max(Math.min(dy, 0) - (110 + (i % 3) * 40), 104 - cd.t); // stay below the HUD
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, t0);
        tl.fromTo(el, { x: dx }, { x: 0, duration: D, ease: "power1.out" }, t0);
        tl.fromTo(el, { y: dy }, { y: apex, duration: D * 0.45, ease: "power2.out" }, t0);
        tl.fromTo(el, { y: apex }, { y: 0, duration: D * 0.55, ease: "power2.in", immediateRender: false }, t0 + D * 0.45);
        // 3-frame spin (stepped scaleX) + 2-step landing squash
        tl.set(el, { scaleX: 0.35 }, t0 + D * 0.2);
        tl.set(el, { scaleX: 1 }, t0 + D * 0.4);
        tl.set(el, { scaleX: 0.35 }, t0 + D * 0.6);
        tl.set(el, { scaleX: 1 }, t0 + D * 0.8);
        tl.set(el, { scaleX: 1.3, scaleY: 0.7 }, t0 + D);
        tl.set(el, { scaleX: 1, scaleY: 1 }, t0 + D + 0.06);
      });

      // ---- card rise: out of the chest (behind its body), up above the lid, then a power3 settle into its slot
      function riseCard(card, dx, tStart) {
        gsap.set(card, { opacity: 0 });
        tl.set(card, { opacity: 1 }, tStart);
        tl.fromTo(card,
          { x: dx, y: -188.4, scale: 0.1, transformOrigin: "50% 50%" },
          { x: dx, y: -288.4, scale: 0.32, duration: 0.26, ease: "power2.out" }, tStart);
        tl.fromTo(card,
          { x: dx, y: -288.4, scale: 0.32 },
          { x: 0, y: 0, scale: 1, duration: 0.95, ease: "power3.out", immediateRender: false }, tStart + 0.26);
      }

      // ---- Scene 3 (2.06–5.48): pink card on "Hugbúnaður" (pickup@2.06); "ÞINN" stamps on "átt" (stamp@4.28)
      riseCard(cardP2, 528, 2.06);
      tl.fromTo(tagP2, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 4.18);
      tl.fromTo(tagP2, { scale: 2.2 }, { scale: 1, duration: 0.10, ease: "steps(2)" }, 4.18);
      tl.set(cardP2, { y: 6 }, 4.28);
      tl.set(cardP2, { y: 0 }, 4.36);

      // ---- Scene 4 (5.48–8.21): green card on "færni" (pickup@5.62); "NÝ FÆRNI" pops (blip@6.50); hold

      // ---- camera: slow steady push-in under the whole shot (smooth, per motion grammar)
      // (camera push-in removed at the user's request — the frame holds still)

      window.__timelines[ID] = tl;

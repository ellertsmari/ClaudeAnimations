  <script>
    (function () {
      var $ = function (n) { return document.getElementById("03-player-one-" + n); };

      // split typed lines into per-character spans (synchronous, deterministic)
      var chars = {};
      ["title", "n1", "n2", "ptitle"].forEach(function (k) {
        var el = $(k);
        var txt = el.textContent;
        el.textContent = "";
        chars[k] = [];
        for (var i = 0; i < txt.length; i++) {
          var s = document.createElement("span");
          s.textContent = txt[i];
          el.appendChild(s);
          chars[k].push(s);
        }
      });

      var tl = gsap.timeline({ paused: true });

      function type(k, start, step) {
        chars[k].forEach(function (s, i) {
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.001 }, start + i * step);
        });
      }
      function show(el, t) {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.001 }, t);
      }

      // ---- Scene 1 (0.00–0.70): PLAYER 1 types, pedestal bar steps in
      type("title", 0.05, 0.065);
      tl.fromTo($("pedestal"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "steps(5)" }, 0.12);

      // ---- Scene 2 (0.70–2.60): sprites drop onto the pedestal in 3 steps
      // Smári — jump@0.70
      show($("s1"), 0.70);
      tl.fromTo($("s1"), { y: -72 }, { y: 0, duration: 0.24, ease: "steps(3)", immediateRender: true }, 0.70);
      type("n1", 0.80, 0.05);
      // Jakub — jump@1.27
      show($("s2"), 1.27);
      tl.fromTo($("s2"), { y: -72 }, { y: 0, duration: 0.24, ease: "steps(3)", immediateRender: true }, 1.27);
      type("n2", 1.37, 0.05);
      // Vefþróun · Vefskólinn steps in at 1.8
      show($("sub"), 1.80);
      tl.fromTo($("sub"), { y: 12 }, { y: 0, duration: 0.16, ease: "steps(2)" }, 1.80);
      // one 2-frame idle bob each, phase-offset (finite)
      tl.set($("s1-b"), { y: -6 }, 1.62);
      tl.set($("s1-b"), { y: 0 }, 1.92);
      tl.set($("s2-b"), { y: -6 }, 2.10);
      tl.set($("s2-b"), { y: 0 }, 2.40);

      // ---- Scene 3 (2.60–5.00): unlock panel opens — menu-open@2.62
      show($("panel"), 2.62);
      tl.fromTo($("panel"), { scaleX: 0.2, scaleY: 0.08 }, { scaleX: 1, scaleY: 1, duration: 0.24, ease: "steps(4)" }, 2.62);
      type("ptitle", 2.90, 0.04);
      // row 1 — unlock@3.75 (green tick badge-pop, 2-step overshoot)
      show($("row1"), 3.75);
      tl.fromTo($("row1"), { x: -18 }, { x: 0, duration: 0.18, ease: "steps(3)" }, 3.75);
      tl.fromTo($("ck1"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1.4, duration: 0.001 }, 3.75);
      tl.to($("ck1"), { scale: 1, duration: 0.001 }, 3.83);
      // row 2 — unlock@4.20
      show($("row2"), 4.20);
      tl.fromTo($("row2"), { x: -18 }, { x: 0, duration: 0.18, ease: "steps(3)" }, 4.20);
      tl.fromTo($("ck2"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1.4, duration: 0.001 }, 4.20);
      tl.to($("ck2"), { scale: 1, duration: 0.001 }, 4.28);

      // ---- Scene 4 (5.00–7.66): Canvas row on "Canvas" (5.02)
      tl.fromTo($("divider"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "steps(4)" }, 5.02);
      show($("canvas"), 5.02);
      tl.fromTo($("canvas"), { y: 12 }, { y: 0, duration: 0.16, ease: "steps(2)" }, 5.02);
      // pink ✕ stamps on "ekki" — buzz@5.77
      tl.fromTo($("x"), { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1.8, duration: 0.001 }, 5.77);
      tl.to($("x"), { scale: 1.25, duration: 0.001 }, 5.83);
      tl.to($("x"), { scale: 1, duration: 0.001 }, 5.89);
      // Canvas row knocked by the stamp (finite stepped shake)
      tl.set($("canvas"), { x: 6 }, 5.77);
      tl.set($("canvas"), { x: -6 }, 5.83);
      tl.set($("canvas"), { x: 6 }, 5.89);
      tl.set($("canvas"), { x: 0 }, 5.95);
      // small line steps in
      show($("note"), 5.85);
      tl.fromTo($("note"), { y: 12 }, { y: 0, duration: 0.16, ease: "steps(2)" }, 5.85);
      // hold — subtle phase-opposed idle on the focal sprites only
      tl.set($("s1-b"), { y: -6 }, 6.50);
      tl.set($("s1-b"), { y: 0 }, 6.80);
      tl.set($("s2-b"), { y: -6 }, 6.95);
      tl.set($("s2-b"), { y: 0 }, 7.25);

      // HUD: 2UP "PRESS START" blinks ~2 Hz across the frame (finite stepped sets)
      for (var t = 0.25; t < 7.6; t += 0.5) {
        tl.set($("press"), { opacity: 0 }, t);
        tl.set($("press"), { opacity: 1 }, t + 0.25);
      }

      // pin the timeline to the frame's exact duration
      tl.set({}, {}, 7.655);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-player-one"] = tl;
    })();
  </script>

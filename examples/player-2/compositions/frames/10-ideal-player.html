    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="10-ideal-player"]');
        function q(k) { return root.querySelector('[data-k="' + k + '"]'); }
        function qa(k) { return root.querySelectorAll('[data-k="' + k + '"]'); }

        var card = q("card"), stats = q("stats"), ghost = q("ghost"), press = q("press");
        var rowA = q("rowA"), rowB = q("rowB"), stamp = q("stamp"), maxEl = q("max"), flash = q("flash");
        var fills = qa("fill");

        var tl = gsap.timeline({ paused: true });

        // hard-cut reveal: element pops on exactly at t (stepped, no fade)
        function show(el, t) {
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, t - 0.001);
        }

        // ---- Scene 1 (0.00–0.97): card flips in like a select screen — select@0.05
        tl.fromTo(card, { scaleX: 0 }, { scaleX: 0.25, duration: 0.001, ease: "none" }, 0.049);
        tl.to(card, { scaleX: 1, duration: 0.18, ease: "steps(3)" }, 0.11);

        // (stat rows / payoffs start hidden via the immediate-render from-state of their show() fromTo)

        // ghost idle bob: 2-frame, one game pixel, finite (stops before the hold)
        for (var b = 0; b < 9; b++) {
          tl.to(ghost, { y: b % 2 === 0 ? -6 : 0, duration: 0.001, ease: "none" }, 0.4 + b * 0.4);
        }

        // ---- Scene 2 (0.97–2.96): FORRITUN row appears — blip@0.97
        show(rowA, 0.97);
        tl.fromTo(rowA, { y: 12 }, { y: 0, duration: 0.08, ease: "steps(2)" }, 0.97);

        // "ekki" — stamp lands at 1.83 (stamp@1.83)
        show(stamp, 1.77);
        tl.fromTo(stamp, { scale: 1.6 }, { scale: 1, duration: 0.06, ease: "steps(2)" }, 1.77);
        tl.to(stats, { x: 6, duration: 0.001, ease: "none" }, 1.83);
        tl.to(stats, { x: -6, duration: 0.001, ease: "none" }, 1.87);
        tl.to(stats, { x: 0, duration: 0.001, ease: "none" }, 1.91);

        // ---- Scene 3 (2.96–4.00): HUGMYND row appears, then fills cell by cell
        show(rowB, 2.96);
        tl.fromTo(rowB, { y: 12 }, { y: 0, duration: 0.08, ease: "steps(2)" }, 2.96);

        // arpeggio@3.14 → 12 coin cells, last lands at 3.85
        var step = (3.85 - 3.14) / 11;
        for (var i = 0; i < fills.length; i++) {
          var t = 3.14 + i * step;
          show(fills[i], t);
          tl.fromTo(fills[i], { scale: 1.3 }, { scale: 1, duration: 0.05, ease: "steps(2)" }, t);
        }

        // MAX pops at 3.95 (ding@3.95) + 1-pixel coin outline flash on the full bar
        show(maxEl, 3.95);
        tl.fromTo(maxEl, { scale: 1.5 }, { scale: 1, duration: 0.08, ease: "steps(2)" }, 3.95);
        show(flash, 3.95);
        tl.to(flash, { opacity: 0, duration: 0.001, ease: "none" }, 4.07);
        tl.to(flash, { opacity: 1, duration: 0.001, ease: "none" }, 4.19);
        tl.to(flash, { opacity: 0, duration: 0.001, ease: "none" }, 4.31);

        // ---- Scene 4 (4.00–6.19): held still. HUD furniture: PRESS START blinks ~2 Hz (finite)
        for (var k = 1; k * 0.5 < 6.19; k++) {
          tl.to(press, { opacity: k % 2 === 1 ? 0 : 1, duration: 0.001, ease: "none" }, k * 0.5);
        }

        window.__timelines = window.__timelines || {};
        window.__timelines["10-ideal-player"] = tl;
      })();
    </script>

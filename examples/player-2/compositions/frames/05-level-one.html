  <script>
    (function () {
      var ID = "05-level-one";
      var END = 6.155;
      var $ = function (n) { return document.getElementById(ID + "-" + n); };
      var tl = gsap.timeline({ paused: true });
      // initial state: applied immediately (so t=0 renders correctly) and pinned at 0 on the timeline
      var init = function (el, vars) { gsap.set(el, vars); tl.set(el, vars, 0); };

      // ---------- furniture: 2UP PRESS START blinks pink/off at ~2 Hz (finite) ----------
      var press = $("press");
      init(press, { opacity: 1 });
      for (var bt = 0.25, bi = 0; bt < END; bt += 0.25, bi++) {
        tl.set(press, { opacity: bi % 2 === 0 ? 0 : 1 }, bt);
      }

      // ---------- Scene 1 (0.00-1.35): banner slides in, node 1 turns coin ----------
      // jingle@0.10 — banner is mid-slide on the jingle, landed by 0.5s
      tl.fromTo($("banner"), { x: -1920 }, { x: 0, duration: 0.44, ease: "power3.out" }, 0.04);

      // typewriter "Hugmyndin" on its word (1.355-1.905) behind a yellow caret
      var chars = $("title").querySelectorAll("span");
      var caret = $("caret");
      init(chars, { display: "none" });
      init(caret, { opacity: 0 });
      tl.set(caret, { opacity: 1 }, 0.5);
      tl.set(caret, { opacity: 0 }, 0.75);
      tl.set(caret, { opacity: 1 }, 1.0);
      tl.set(caret, { opacity: 0 }, 1.2);
      tl.set(caret, { opacity: 1 }, 1.355);
      for (var c = 0; c < chars.length; c++) {
        tl.set(chars[c], { display: "inline" }, 1.355 + c * 0.058);
      }
      for (var ct = 2.1, ci = 0; ct < 2.8; ct += 0.25, ci++) {
        tl.set(caret, { opacity: ci % 2 === 0 ? 0 : 1 }, ct);
      }
      tl.set(caret, { opacity: 0 }, 2.85);

      // node 1 becomes the current level on "Fyrsta" (0.68) + stepped pulse rings
      var now = $("n1now"), ring = $("ring");
      init(now, { opacity: 0 });
      init(ring, { opacity: 0, scale: 1 });
      tl.set(now, { opacity: 1 }, 0.68);
      tl.set($("n1"), { opacity: 0 }, 0.68);
      [0.68, 1.18, 1.68].forEach(function (pt) {
        tl.fromTo(ring, { opacity: 0.9, scale: 1 },
          { opacity: 0, scale: 1.7, duration: 0.42, ease: "steps(4)", immediateRender: false }, pt);
      });

      // ---------- Scene 2 (1.35-3.80): ghost, board, scribble, bulb ----------
      var ghost = $("ghost"), you = $("you"), bulb = $("idea"), panel = $("panel");
      // "Þú" (2.818): pink ghost steps in above node 1
      init(ghost, { opacity: 0, x: -36 });
      init(you, { opacity: 0 });
      tl.set(ghost, { opacity: 0.4, x: -36 }, 2.82);
      tl.set(ghost, { x: -18 }, 2.87);
      tl.set(ghost, { x: 0 }, 2.92);
      tl.set(you, { opacity: 1 }, 2.92);

      // "segir" (2.993): the board panel opens on hard steps
      init(panel, { opacity: 0, scaleY: 1 });
      tl.set(panel, { opacity: 1, scaleY: 0.2 }, 2.99);
      tl.set(panel, { scaleY: 0.6 }, 3.05);
      tl.set(panel, { scaleY: 1 }, 3.11);

      // "okkur" (3.28) scribble@3.28: dotted sketch draws itself (svg-path-draw, stepped)
      var mpaths = [$("m1"), $("m2"), $("m3")];
      var fallback = [269.6, 212, 545.28];
      var lens = mpaths.map(function (p, i) {
        var l = 0;
        try { l = p.getTotalLength(); } catch (e) { l = 0; }
        if (!l) l = fallback[i];
        l = l * 1.05;
        p.style.strokeDasharray = l + " " + l;
        p.style.strokeDashoffset = l;
        return l;
      });
      tl.fromTo(mpaths[0], { strokeDashoffset: lens[0] }, { strokeDashoffset: 0, duration: 0.26, ease: "steps(5)" }, 3.28);
      tl.fromTo(mpaths[1], { strokeDashoffset: lens[1] }, { strokeDashoffset: 0, duration: 0.2, ease: "steps(4)" }, 3.47);
      tl.fromTo(mpaths[2], { strokeDashoffset: lens[2] }, { strokeDashoffset: 0, duration: 0.36, ease: "steps(6)" }, 3.62);

      // "vantar" (3.843) ding@3.84: bulb 2-step pop above the ghost
      init(bulb, { opacity: 0, scale: 0.5, y: 12 });
      tl.set(bulb, { opacity: 1, scale: 0.6, y: 6 }, 3.84);
      tl.set(bulb, { scale: 1.25, y: -6 }, 3.89);
      tl.set(bulb, { scale: 1, y: 0 }, 3.95);

      // ghost + bulb idle bob (2-frame, stepped, finite)
      var p2grp = $("p2grp");
      init(p2grp, { y: 0 });
      for (var gt = 3.2, gi = 0; gt < END; gt += 0.3, gi++) {
        tl.set(p2grp, { y: gi % 2 === 0 ? -6 : 0 }, gt);
      }

      // ---------- Scene 3 (3.80-6.16): P1 hop in, wireframe snap, XP ----------
      // "við" (4.48) jump@4.48: the two cyan sprites hop in at the right of the board
      [["smari", 4.48], ["jakub", 4.56]].forEach(function (s) {

<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ink","type":"color","label":"Ink","default":"#17140f"},
    {"id":"color-paper","type":"color","label":"Paper","default":"#f3eee4"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#e5461c"},
    {"id":"color-teal","type":"color","label":"Teal","default":"#1d6b73"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>View Source</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ink: #17140f;
        --color-paper: #f3eee4;
        --color-accent: #e5461c;
        --color-teal: #1d6b73;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ink); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="74" data-width="1920" data-height="1080">
      <!-- one scene per file; where it starts in the film and how long it lasts -->
      <div id="inspect" data-composition-id="inspect" data-composition-src="compositions/inspect.html"
           data-start="0" data-duration="10" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="films" data-composition-id="films" data-composition-src="compositions/films.html"
           data-start="10" data-duration="12" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="talk" data-composition-id="talk" data-composition-src="compositions/talk.html"
           data-start="22" data-duration="12" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="steps" data-composition-id="steps" data-composition-src="compositions/steps.html"
           data-start="34" data-duration="16.5" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="render" data-composition-id="render" data-composition-src="compositions/render.html"
           data-start="50.5" data-duration="7.5" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="yourturn" data-composition-id="yourturn" data-composition-src="compositions/yourturn.html"
           data-start="58" data-duration="16" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- sound, written in code by tools/make_music.py -->
      <audio id="music" src="assets/audio/music.mp3" data-start="0" data-duration="74" data-track-index="10" data-volume="0.65"></audio>
      <audio id="sfx" src="assets/audio/sfx.mp3" data-start="0" data-duration="74" data-track-index="11" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 74 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

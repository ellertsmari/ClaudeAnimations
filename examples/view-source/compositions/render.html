  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const N = 30;
      const hero = document.querySelectorAll(".s5-h");

      document.querySelectorAll("#s5-line span").forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out" }, 0.1 + i * 0.08);
      });
      tl.set(hero[0], { opacity: 1 }, 0);

      // the frame counter races up while the stills are taken faster and faster
      const n = document.getElementById("s5-n"), c = { v: 1 };
      tl.fromTo(c, { v: 1 }, { v: 2220, duration: 4.8, ease: "power2.in",
        onUpdate: () => { n.textContent = String(Math.round(c.v)).padStart(4, "0"); } }, 0.6);

      for (let k = 1; k <= N; k++) {
        const t = 0.6 + 4.7 * Math.pow(k / N, 0.55);
        const card = document.getElementById("s5-c" + k);
        if (k > 1) { tl.set(hero[k - 2], { opacity: 0 }, t); tl.set(hero[k - 1], { opacity: 1 }, t); }
        tl.fromTo("#s5-flash", { opacity: 0.85 }, { opacity: 0, duration: 0.1, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(card, { x: 340, y: 410, rotation: 0, scale: 1.4, opacity: 1 },
          { x: +card.dataset.x, y: +card.dataset.y, rotation: +card.dataset.r, scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false }, t);
        tl.set(card, { opacity: 0 }, 0);
      }

      // 5.45 the stills play back as a flipbook: that is all a video is
      const START = 5.45, FPS = 0.045;
      tl.set(hero[N - 1], { opacity: 0 }, START);
      for (let k = 0; k < N; k++) {
        tl.set(hero[k], { opacity: 1 }, START + k * FPS);
        if (k < N - 1) tl.set(hero[k], { opacity: 0 }, START + (k + 1) * FPS);
      }
      tl.fromTo("#s5-file", { opacity: 0, scale: 0.8, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 6.2);

      window.__timelines["render"] = tl;
    })();

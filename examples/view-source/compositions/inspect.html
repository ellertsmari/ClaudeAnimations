  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      // 0.0 the page fills the frame; 1.0-1.8 pull back to show it is a browser tab
      tl.fromTo("#s1-cam", { scale: 1.271, y: -51, transformOrigin: "960px 591px" },
                           { scale: 1, y: 0, duration: 0.8, ease: "power2.inOut" }, 1.0);

      // 1.9 the cursor comes in from the bottom right and lands on the title
      tl.set("#s1-cursor", { x: 1500, y: 1120, scale: 1, opacity: 1 }, 0);
      tl.to("#s1-cursor", { x: 640, y: 520, duration: 0.6, ease: "power3.out" }, 1.9);
      // 2.6 right-click
      tl.to("#s1-cursor", { scale: 0.88, duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, 2.6);
      tl.fromTo("#s1-menu", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, 2.66);
      // down to Inspect
      tl.to("#s1-cursor", { x: 690, y: 948, duration: 0.45, ease: "power2.inOut" }, 2.85);
      tl.set("#s1-inspect-row", { backgroundColor: "#e8f0fe" }, 3.18);
      tl.to("#s1-cursor", { scale: 0.88, duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, 3.4);
      // 3.45 DevTools docks: the menu closes, the page narrows, the h1 is highlighted
      tl.set("#s1-menu", { opacity: 0 }, 3.45);
      tl.set("#s1-view", { width: 960 }, 3.45);
      tl.set("#s1-dev", { opacity: 1 }, 3.45);
      tl.set("#s1-row-h1", { backgroundColor: "#2f4562" }, 3.45);
      tl.set(["#s1-hl", "#s1-tip"], { opacity: 1 }, 3.5);

      // 4.4 to the text node in the Elements tree; double-click "film"
      tl.to("#s1-cursor", { x: 1418, y: 412, duration: 0.45, ease: "power2.inOut" }, 4.3);
      tl.set(["#s1-hl", "#s1-tip"], { opacity: 0 }, 4.85);
      tl.to("#s1-cursor", { scale: 0.88, duration: 0.05, yoyo: true, repeat: 1, ease: "none" }, 4.9);
      tl.to("#s1-cursor", { scale: 0.88, duration: 0.05, yoyo: true, repeat: 1, ease: "none" }, 5.02);
      tl.set("#s1-row-h1", { backgroundColor: "rgba(0,0,0,0)" }, 5.08);
      tl.set("#s1-node", { backgroundColor: "#2f4562" }, 5.08);
      tl.set("#s1-film", { backgroundColor: "#3d6fb5" }, 5.1);
      tl.set("#s1-cursor", { opacity: 0 }, 5.2);

      // 5.3 typing "web page", live in the page and in the DOM, one key every 0.075 s
      tl.set(["#s1-film", "#s1-pg-film"], { display: "none" }, 5.3);
      const devKeys = document.querySelectorAll("#s1-node span.ty");
      const pageKeys = document.querySelectorAll("#s1-title span");
      for (let k = 0; k < 8; k++) {
        tl.set([devKeys[k], pageKeys[k]], { display: "inline" }, 5.3 + k * 0.075);
      }
      // 6.0 Enter
      tl.set("#s1-node", { backgroundColor: "rgba(0,0,0,0)" }, 6.0);
      tl.set("#s1-cursor", { opacity: 1 }, 7.4);

      // 7.4 Styles: click the font-size value and push it up
      tl.set("#s1-cursor", { x: 1600, y: 620 }, 7.39);
      tl.to("#s1-cursor", { x: 1335, y: 800, duration: 0.5, ease: "power2.out" }, 7.4);
      tl.to("#s1-cursor", { scale: 0.88, duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, 8.0);
      tl.set("#s1-fsval", { backgroundColor: "#ffffff", color: "#202124" }, 8.05);
      const fs = { v: 180 };
      const title = $("#s1-title"), val = $("#s1-fsval");
      tl.fromTo(fs, { v: 180 }, { v: 600, duration: 0.95, ease: "power2.in",
        onUpdate: () => { title.style.fontSize = fs.v + "px"; val.textContent = Math.round(fs.v) + "px"; } }, 8.1);

      // 9.0 dive into the giant letters; ink floods the frame
      tl.fromTo("#s1-dive", { scale: 1, transformOrigin: "560px 700px" }, { scale: 7, duration: 0.95, ease: "power3.in" }, 9.0);
      tl.fromTo("#s1-flood", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.in" }, 9.62);

      window.__timelines["inspect"] = tl;
    })();
  </script>

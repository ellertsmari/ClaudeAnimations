<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <!-- one line per scene: where it starts on the film and how long it lasts -->
      <div id="el-s1" class="scene" data-composition-id="s1" data-composition-src="compositions/s1.html"
           data-start="0" data-duration="4" data-track-index="0"></div>
      <div id="el-s2" class="scene" data-composition-id="s2" data-composition-src="compositions/s2.html"
           data-start="4" data-duration="4" data-track-index="1"></div>
      <!-- music and voice go here as <audio> elements with data-start / data-duration -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 8 }, 0); // the root timeline is as long as the film
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
